<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#b9d9f5">
  <meta name="description" content="A glowing 3D heart made from the words I love you.">
  <title>I Love You — A Heart Made of Words</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene" aria-label="An animated heart made from repeated I love you messages">
    <div class="ambient ambient--one"></div>
    <div class="ambient ambient--two"></div>

    <section class="phone-frame">
      <div class="frame-glow"></div>
      <header class="topbar">
        <span class="topbar__dot"></span>
        <span>MADE WITH LOVE</span>
        <span class="topbar__right">∞</span>
      </header>

      <div class="heart-stage">
        <div class="heart-aura"></div>
        <div class="heart" id="heart" aria-hidden="true"></div>
        <div class="heart-caption">
          <span class="caption-line"></span>
          <span>EVERY WORD IS FOR YOU</span>
          <span class="caption-line"></span>
        </div>
      </div>

      <footer class="bottom-panel">
        <div class="bottom-panel__label">A LITTLE REMINDER</div>
        <div class="bottom-panel__message">I love you <span>♡</span></div>
        <div class="bottom-panel__sub">SOURCE CODE · LINK IN BIO</div>
      </footer>
      <div class="watermark">oduok_code</div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
